name: Release WorkLog AI Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: cd apps/desktop && npm ci

      - name: Build macOS Application
        run: cd apps/desktop && npm run tauri build

      - name: Package macOS Artifacts
        run: |
          mkdir -p release-artifacts
          cp -r apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          cp -r apps/desktop/src-tauri/target/release/bundle/macos/*.app release-artifacts/ 2>/dev/null || true

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: release-artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: cd apps/desktop && npm ci

      - name: Build Windows Setup
        run: cd apps/desktop && npm run tauri build

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-files/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
